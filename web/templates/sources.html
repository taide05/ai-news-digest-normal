{% extends "base.html" %}
{% block content %}
<h1>信息源管理</h1>

<div class="sources-toolbar">
    <button class="btn" hx-on:click="document.getElementById('add-form').classList.add('show-form');var e=document.getElementById('add-error');if(e)e.style.display='none'">+ 添加源</button>
</div>

<div id="add-form" class="add-source-form">
    <h3>添加新信息源</h3>
    <form hx-post="/api/sources" hx-swap="none"
          hx-on:htmx:afterRequest="try{var r=JSON.parse(event.detail.xhr.response);if(r.status!=='ok'){var e=document.getElementById('add-error');e.textContent=r.message;e.style.display='block'}}catch(e){}">
        <input type="text" name="id" placeholder="ID (e.g. my-rss)" required>
        <input type="text" name="name" placeholder="名称" required>
        <select name="type">
            <option value="rss">RSS</option>
            <option value="api">API</option>
            <option value="web">Web</option>
        </select>
        <input type="text" name="config" placeholder='Config JSON (e.g. {"url": "https://..."})' required>
        <input name="hide_keywords" placeholder='排除关键词 JSON数组 如 ["赞助","广告"]' value="[]">
        <input name="highlight_keywords" placeholder='高亮关键词 JSON数组 如 ["AI","LLM"]' value="[]">
        <input name="require_keywords" placeholder='必须包含关键词 JSON数组 如 ["论文"]' value="[]">
        <input name="filter_keywords" type="hidden" value="[]">
        <div id="add-error" style="color:#f85149;display:none;margin-bottom:8px"></div>
        <button type="submit" class="btn">添加</button>
        <button type="button" class="btn btn-secondary" hx-on:click="document.getElementById('add-form').classList.remove('show-form');var e=document.getElementById('add-error');if(e)e.style.display='none'">取消</button>
    </form>
</div>

<table class="sources-table">
<thead><tr><th>ID</th><th>名称</th><th>类型</th><th>过滤词</th><th>状态</th><th>操作</th></tr></thead>
<tbody>
{% for s in sources %}
<tr>
    <td>{{ s.id }}</td>
    <td>{{ s.name }}</td>
    <td>{{ s.type }}</td>
    <td>{{ s.filter_keywords }}</td>
    <td>
        <input type="checkbox" name="enabled" value="true"
               {% if s.enabled %}checked{% endif %}
               hx-patch="/api/sources/{{ s.id }}"
               hx-include="this"
               hx-trigger="change"
               hx-swap="none">
    </td>
    <td>
        <button class="btn btn-danger btn-sm"
                hx-delete="/api/sources/{{ s.id }}"
                hx-confirm="确定删除 {{ s.id }} ?"
                hx-target="closest tr"
                hx-swap="delete">
            删除
        </button>
    </td>
</tr>
{% endfor %}
</tbody>
</table>
{% endblock %}
